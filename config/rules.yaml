# Detection rules. Each rule describes a single behaviour of interest (a
# "detection signal"); the correlation engine recombines signals into
# higher-order alerts rather than stacking behaviours inside one rule.
#
# Optional `phase` and `weight` (Jack Crook's I-BAD framing) let the
# correlation engine score an entity's behavioural *progression* across
# kill-chain phases. Both are ignored by the rule matcher itself — they only
# feed correlation. Phases used here: reconnaissance, tracking, evasion.
#
# Personal counter-surveillance defaults: the old corporate "SSID not CorpNet"
# rule is disabled — prefer enrichment + correlation (persistence while moving)
# over noisy SSID allowlists.

wifi_rules:
  # Disabled for personal use — an SSID-allowlist rule fires on nearly every
  # public network. Re-enable and set `value` to your own SSID fragment to use
  # it as a "networks that aren't mine" signal.
  - id: ssid_spoof_suspect
    enabled: false
    description: "SSID not in personal allowlist (disabled by default)"
    severity: 3
    confidence: 0.8
    phase: reconnaissance
    weight: 1
    conditions:
      - field: SSID
        op: not_contains
        value: "MyHomeNet"

bluetooth_rules:
  - id: ble_close_proximity
    enabled: true
    description: "Bluetooth device in very close proximity (strong RSSI)"
    severity: 3
    confidence: 0.75
    phase: tracking
    weight: 2
    conditions:
      - field: rssi
        op: gt
        value: "-50"
  - id: ble_tracker_suspect
    enabled: true
    description: "Bluetooth device name matches a known tracker pattern"
    severity: 4
    confidence: 0.8
    phase: tracking
    weight: 3
    conditions:
      - field: name
        op: contains
        value: "AirTag"
  # Enrichment-based rules: match what the device IS, not the literal string
  # it advertises today (fields added by src/core/enrichment.py).
  - id: ble_tracker_fingerprint
    enabled: true
    description: "Device fingerprint matches a known tracker (name pattern or vendor OUI)"
    severity: 4
    confidence: 0.8
    phase: tracking
    weight: 3
    conditions:
      - field: is_tracker
        op: eq
        value: true
  - id: ble_randomized_mac_close
    enabled: true
    description: "Randomized-MAC device in close proximity (tracker-like behaviour)"
    severity: 3
    confidence: 0.7
    phase: evasion
    weight: 2
    conditions:
      - field: mac_randomized
        op: eq
        value: true
      - field: rssi
        op: gt
        value: "-60"
