[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigress"
version = "0.2.0"
description = "Threat Intelligence Grid for Android - Security monitoring framework for Android/Termux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "DonkeypunchEX", email = "donkeypunchex@example.com"}
]
keywords = [
    "security",
    "threat-intelligence",
    "android",
    "termux",
    "monitoring",
    "detection",
    "correlation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # Core detection / ML
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    # Config and dashboard
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.34",
    # Security modules
    "cryptography>=41.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "httpx>=0.25",
    # Linting & formatting
    "ruff>=0.6",
    # Security scanning
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Type checking
    "mypy>=1.8",
]

[project.scripts]
tigress = "src.dashboard.app:main"

[project.urls]
Homepage = "https://github.com/DonkeypunchEX/TIGRESS-Threat-Intelligence-Grid"
Documentation = "https://github.com/DonkeypunchEX/TIGRESS-Threat-Intelligence-Grid#readme"
Repository = "https://github.com/DonkeypunchEX/TIGRESS-Threat-Intelligence-Grid"
Issues = "https://github.com/DonkeypunchEX/TIGRESS-Threat-Intelligence-Grid/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-n auto -v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
]
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
skip = ["B101"]
paths = ["src"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[tool.benchmark]
histogram = ["time"]
